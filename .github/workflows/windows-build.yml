name: Windows build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.configuration }} x64
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build
        shell: pwsh
        run: |
          msbuild ".\luvkrimes base\luvkrimes base.vcxproj" `
            /m `
            /p:Configuration="${{ matrix.configuration }}" `
            /p:Platform="x64" `
            /p:PreferredToolArchitecture="x64" `
            /verbosity:minimal
