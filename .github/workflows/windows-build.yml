name: Windows build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.configuration }} x64
    runs-on: windows-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build application
        shell: pwsh
        run: |
          msbuild ".\luvkrimes base\luvkrimes base.vcxproj" `
            /m `
            /p:Configuration="${{ matrix.configuration }}" `
            /p:Platform="x64" `
            /p:PreferredToolArchitecture="x64" `
            /verbosity:minimal

      - name: Build loader
        shell: pwsh
        run: |
          msbuild ".\loader\luvkrimes-loader.vcxproj" `
            /m `
            /p:Configuration="${{ matrix.configuration }}" `
            /p:Platform="x64" `
            /p:PreferredToolArchitecture="x64" `
            /verbosity:minimal

      - name: Build tests
        shell: pwsh
        run: |
          msbuild ".\tests\luvkrimes-tests.vcxproj" `
            /m `
            /p:Configuration="${{ matrix.configuration }}" `
            /p:Platform="x64" `
            /p:PreferredToolArchitecture="x64" `
            /verbosity:minimal

      - name: Run tests
        shell: pwsh
        run: |
          & ".\tests\bin\x64\${{ matrix.configuration }}\luvkrimes-tests.exe"
