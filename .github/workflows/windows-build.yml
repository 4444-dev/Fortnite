name: Windows build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.configuration }} x64
    runs-on: windows-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          msbuild-architecture: x64

      - name: Verify KeyAuth bootstrap repeatability
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          & ".\scripts\bootstrap-keyauth.ps1"
          $authPath = ".\thirdparty\keyauth\auth.cpp"
          $first = (Get-FileHash -LiteralPath $authPath -Algorithm SHA256).Hash

          & ".\scripts\bootstrap-keyauth.ps1"
          $second = (Get-FileHash -LiteralPath $authPath -Algorithm SHA256).Hash

          if ($first -ne $second) {
            throw "KeyAuth bootstrap is not repeatable."
          }

      - name: Build application
        shell: pwsh
        run: |
          msbuild ".\luvkrimes base\luvkrimes base.vcxproj" `
            /m `
            /p:Configuration="${{ matrix.configuration }}" `
            /p:Platform="x64" `
            /p:PreferredToolArchitecture="x64" `
            /verbosity:minimal

      - name: Build loader
        shell: pwsh
        run: |
          msbuild ".\loader\luvkrimes-loader.vcxproj" `
            /m `
            /p:Configuration="${{ matrix.configuration }}" `
            /p:Platform="x64" `
            /p:PreferredToolArchitecture="x64" `
            /verbosity:minimal

      - name: Build tests
        shell: pwsh
        run: |
          msbuild ".\tests\luvkrimes-tests.vcxproj" `
            /m `
            /p:Configuration="${{ matrix.configuration }}" `
            /p:Platform="x64" `
            /p:PreferredToolArchitecture="x64" `
            /verbosity:minimal

      - name: Verify expected outputs
        shell: pwsh
        run: |
          $expected = @(
            ".\luvkrimes base\x64\${{ matrix.configuration }}\luvkrimes base.exe",
            ".\loader\bin\x64\${{ matrix.configuration }}\luvkrimes-loader.exe",
            ".\tests\bin\x64\${{ matrix.configuration }}\luvkrimes-tests.exe"
          )

          foreach ($path in $expected) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected build output missing: $path"
            }
          }

      - name: Run tests
        shell: pwsh
        run: |
          $testExecutable = ".\tests\bin\x64\${{ matrix.configuration }}\luvkrimes-tests.exe"

          foreach ($attempt in 1..2) {
            & $testExecutable
            if ($LASTEXITCODE -ne 0) {
              throw "Regression test pass $attempt failed with exit code $LASTEXITCODE."
            }
          }

      - name: Install NSIS
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          choco install nsis --version=3.12.0 --yes --no-progress

      - name: Build distribution package
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          & ".\scripts\package-release.ps1" -Version "0.0.0-ci"

          $expected = @(
            ".\dist\Luvkrimes-Setup-0.0.0-ci.exe",
            ".\dist\Luvkrimes-Portable-0.0.0-ci.zip",
            ".\dist\SHA256SUMS.txt"
          )

          foreach ($path in $expected) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected distribution artifact is missing: $path"
            }
          }

      - name: Test installer round-trip
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $installer = (Resolve-Path ".\dist\Luvkrimes-Setup-0.0.0-ci.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "luvkrimes-install"

          if (Test-Path -LiteralPath $installDir) {
            Remove-Item -LiteralPath $installDir -Recurse -Force
          }

          $install = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru

          if ($install.ExitCode -ne 0) {
            throw "Silent installer failed with exit code $($install.ExitCode)."
          }

          $installed = @(
            (Join-Path $installDir "Luvkrimes.exe"),
            (Join-Path $installDir "projects\fortnite\Luvkrimes-Fortnite.exe"),
            (Join-Path $installDir "Uninstall.exe")
          )

          foreach ($path in $installed) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Installed file is missing: $path"
            }
          }

          $uninstaller = Join-Path $installDir "Uninstall.exe"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru

          if ($uninstall.ExitCode -ne 0) {
            throw "Silent uninstaller failed with exit code $($uninstall.ExitCode)."
          }

          foreach ($path in $installed[0..1]) {
            if (Test-Path -LiteralPath $path) {
              throw "Uninstaller left product binary behind: $path"
            }
          }
